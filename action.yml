name: 'Detect ACL Drift'
description: 'Detects ACL drift in Tailscale and creates a pull request if drift is detected.'
inputs:
    policy-file:
        description: 'The path to the ACL policy file in the repository.'
        required: true
        default: 'policy.hujson'
    branch-name:
        description: 'The name of the branch to create for the pull request.'
        required: true
        default: 'drift-reconciliation'
    ts-oidc-client-id:
        description: 'The OIDC client ID for Tailscale.'
        required: true
    ts-oidc-audience:
        description: 'The OIDC audience for Tailscale.'
        required: true
    ts-tailnet:
        description: 'The Tailscale tailnet name.'
        required: true
        default: '-'
    create-pr:
        description: 'Whether to create a pull request if drift is detected.'
        required: false
        default: 'true'

runs:
    using: 'composite'
    steps:
      - id: id_token
        name: Request an OIDC token from GitHub
        env:
          TS_OIDC_AUDIENCE: ${{ inputs.ts-oidc-audience }}
        shell: bash
        run: |
          id_token="$(
            curl --silent --show-error --fail \
              --variable '%ACTIONS_ID_TOKEN_REQUEST_TOKEN' \
              --variable '%ACTIONS_ID_TOKEN_REQUEST_URL' \
              --variable '%TS_OIDC_AUDIENCE' \
              --expand-header "Authorization: bearer {{ACTIONS_ID_TOKEN_REQUEST_TOKEN}}" \
              --expand-url "{{ACTIONS_ID_TOKEN_REQUEST_URL}}&audience={{TS_OIDC_AUDIENCE}}" \
            | jq --raw-output --exit-status '.value'
          )"
          echo "::add-mask::${id_token}" # Mask the token in the logs to prevent accidental exposure.
          echo "id_token=${id_token}" >> "$GITHUB_OUTPUT" # Expose the token to subsequent steps.

      - name: Authenticate to Tailscale via OIDC
        id: authenticate
        env:
          TS_OIDC_CLIENT_ID: ${{ inputs.ts-oidc-client-id }}
          JWT: ${{ steps.id_token.outputs.id_token }}
          TS_TOKEN_EXCHANGE_URL: https://api.tailscale.com/api/v2/oauth/token-exchange
        shell: bash
        run: |
          api_token="$(
            curl --silent --show-error --fail \
              --header 'Content-Type: application/x-www-form-urlencoded' \
              --variable '%TS_OIDC_CLIENT_ID' \
              --variable '%JWT' \
              --variable '%TS_TOKEN_EXCHANGE_URL' \
              --expand-data 'client_id={{TS_OIDC_CLIENT_ID}}' \
              --expand-data 'jwt={{JWT}}' \
              --expand-url '{{TS_TOKEN_EXCHANGE_URL}}' \
              | jq --raw-output --exit-status '.access_token'
          )"
          echo "::add-mask::${api_token}" # Mask the token in the logs to prevent accidental exposure.
          echo "tailscale_api_token=${api_token}" >> "$GITHUB_OUTPUT" # Expose the token to subsequent steps.

      - name: Get current ACL policy from Tailscale
        id: get_policy
        env:
          TS_TOKEN: '${{ steps.authenticate.outputs.tailscale_api_token }}'
          REQUEST_URL: 'https://api.tailscale.com/api/v2/tailnet/${{ inputs.ts-tailnet }}/acl'
          POLICY_FILE: '${{ inputs.policy-file }}'
        shell: bash
        run: |
          > ${POLICY_FILE} \
            curl --silent --show-error --fail \
            --variable '%TS_TOKEN' \
            --variable '%REQUEST_URL' \
            --expand-header "Authorization: Bearer {{TS_TOKEN}}" \
            --expand-url '{{REQUEST_URL}}' \
          | perl -pe 'chomp if eof' # remove the spurious extra newline

      - name: Check for ACL drift
        id: check_drift
        env:
          POLICY_FILE: '${{ inputs.policy-file }}'
        shell: bash
        run: |
          if git diff --exit-code ${POLICY_FILE}; then
            echo "No ACL drift detected."
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
          else
            echo "ACL drift detected."
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v8
        if: ${{ inputs.create-pr == 'true' }}
        with:
          add-paths: ${{ inputs.policy-file }} # only add the policy file to the PR
          commit-message: "chore(acl): automatically reconcile tailnet policy drift"
          title: "chore(acl): reconcile tailnet policy drift"
          body: |
            :robot: This PR was generated automatically from the live Tailscale ACL policy after
            detecting drift from the version in this repository.
            
            Review and merge to update the repository to match the live policy.
          base: ${{ github.event.repository.default_branch }}
          branch: ${{ inputs.branch-name }}
          delete-branch: true # this will delete the branch if the policy is unchanged (i.e. if the ACL was manually reconciled) https://github.com/peter-evans/create-pull-request/tree/v8#delete-branch
          labels: drift-detection

      - name: Write summary
        id: summary
        env:
          CREATE_PR: ${{ inputs.create-pr }}
          PULL_REQUEST_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
          DRIFT_DETECTED: ${{ steps.check_drift.outputs.drift_detected }}
        shell: bash
        run: |
          case "${DRIFT_DETECTED}" in
            false)
              echo '## ✅ No ACL drift detected.' | tee -a "${GITHUB_STEP_SUMMARY}"
              ;;
            true)
              echo '## ⚠️ ACL drift detected.' | tee -a "${GITHUB_STEP_SUMMARY}"
              ;;
            *)
              echo "## Error: Unexpected value for DRIFT_DETECTED: ${DRIFT_DETECTED}" | tee -a "${GITHUB_STEP_SUMMARY}"
              exit 1
              ;;
          esac
          if [[ "${CREATE_PR}" == "true" ]]; then
            case "${PULL_REQUEST_OPERATION}" in
              created)
                echo '✨ A pull request has been created to reconcile the ACL drift. Please review and merge it.' | tee -a "${GITHUB_STEP_SUMMARY}"
                ;;
              updated)
                echo '🔄 An existing drift-reconciliation pull request has been updated.' | tee -a "${GITHUB_STEP_SUMMARY}"
                ;;
              closed)
                echo '❌ The pull request has been closed. If the ACL drift was reconciled, no further action is needed.' | tee -a "${GITHUB_STEP_SUMMARY}"
                ;;
              none)
                :
                ;;
              *)
                echo "## Error: Unexpected value for PULL_REQUEST_OPERATION: ${PULL_REQUEST_OPERATION}" | tee -a '${GITHUB_STEP_SUMMARY}'
                exit 1
                ;;
            esac
          fi